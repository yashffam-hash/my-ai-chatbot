<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button id="new-chat-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>
            <div class="sidebar-section-title">Recent</div>
            <div class="chats-list" id="chats-list"></div>
            <div class="sidebar-bottom">
                <div class="brand">
                    <div class="brand-dot"></div>
                    <span>AI Chatbot</span>
                </div>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <div class="main-area">

            <header class="chat-header">
                <div class="header-left">
                    <button id="sidebar-toggle" title="Menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="header-title">
                        <h1>AI Chatbot</h1>
                        <span class="status-dot"></span>
                        <span class="status-text">Online</span>
                    </div>
                </div>

                <div class="menu-wrapper">
                    <button id="menu-button" title="Menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="5" r="1.5"></circle>
                            <circle cx="12" cy="12" r="1.5"></circle>
                            <circle cx="12" cy="19" r="1.5"></circle>
                        </svg>
                    </button>
                    <div id="menu-dropdown" class="menu-dropdown">
                        <button id="search-toggle" class="menu-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <span>Search</span>
                        </button>
                        <button id="lang-button" class="menu-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            <span id="lang-label">English</span>
                        </button>
                        <button id="voice-toggle" class="menu-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                            <span>Voice ON</span>
                        </button>
                        <button id="theme-button" class="menu-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            <span>Dark mode</span>
                        </button>
                        <button id="suggestions-toggle" class="menu-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="18" x2="15" y2="18"></line><line x1="10" y1="22" x2="14" y2="22"></line><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg>
                            <span>Suggestions OFF</span>
                        </button>
                        <div class="menu-divider"></div>
                        <button id="clear-button" class="menu-item danger">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            <span>Clear messages</span>
                        </button>
                    </div>
                </div>
            </header>

            <div id="search-bar" class="search-bar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Search messages..." autocomplete="off">
                <button id="search-close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div id="chat-box" class="chat-box"></div>

            <div id="quick-replies" class="quick-replies hidden"></div>

            <div id="attachment-preview" class="attachment-preview"></div>

            <div id="emoji-picker" class="emoji-picker">
                <div class="emoji-category">
                    <button class="emoji" data-emoji="😀">😀</button>
                    <button class="emoji" data-emoji="😃">😃</button>
                    <button class="emoji" data-emoji="😄">😄</button>
                    <button class="emoji" data-emoji="😁">😁</button>
                    <button class="emoji" data-emoji="😆">😆</button>
                    <button class="emoji" data-emoji="😅">😅</button>
                    <button class="emoji" data-emoji="😂">😂</button>
                    <button class="emoji" data-emoji="🤣">🤣</button>
                    <button class="emoji" data-emoji="😊">😊</button>
                    <button class="emoji" data-emoji="😇">😇</button>
                    <button class="emoji" data-emoji="🙂">🙂</button>
                    <button class="emoji" data-emoji="😉">😉</button>
                    <button class="emoji" data-emoji="😌">😌</button>
                    <button class="emoji" data-emoji="😍">😍</button>
                    <button class="emoji" data-emoji="🥰">🥰</button>
                    <button class="emoji" data-emoji="😘">😘</button>
                    <button class="emoji" data-emoji="😋">😋</button>
                    <button class="emoji" data-emoji="😛">😛</button>
                    <button class="emoji" data-emoji="😜">😜</button>
                    <button class="emoji" data-emoji="🤪">🤪</button>
                    <button class="emoji" data-emoji="🤗">🤗</button>
                    <button class="emoji" data-emoji="🤔">🤔</button>
                    <button class="emoji" data-emoji="😐">😐</button>
                    <button class="emoji" data-emoji="😏">😏</button>
                    <button class="emoji" data-emoji="😒">😒</button>
                    <button class="emoji" data-emoji="🙄">🙄</button>
                    <button class="emoji" data-emoji="😴">😴</button>
                    <button class="emoji" data-emoji="😎">😎</button>
                    <button class="emoji" data-emoji="🤓">🤓</button>
                    <button class="emoji" data-emoji="😕">😕</button>
                    <button class="emoji" data-emoji="😢">😢</button>
                    <button class="emoji" data-emoji="😭">😭</button>
                    <button class="emoji" data-emoji="😱">😱</button>
                    <button class="emoji" data-emoji="😡">😡</button>
                    <button class="emoji" data-emoji="👍">👍</button>
                    <button class="emoji" data-emoji="👎">👎</button>
                    <button class="emoji" data-emoji="👏">👏</button>
                    <button class="emoji" data-emoji="🙌">🙌</button>
                    <button class="emoji" data-emoji="🤝">🤝</button>
                    <button class="emoji" data-emoji="🙏">🙏</button>
                    <button class="emoji" data-emoji="💪">💪</button>
                    <button class="emoji" data-emoji="✌️">✌️</button>
                    <button class="emoji" data-emoji="👋">👋</button>
                    <button class="emoji" data-emoji="✋">✋</button>
                    <button class="emoji" data-emoji="👌">👌</button>
                    <button class="emoji" data-emoji="❤️">❤️</button>
                    <button class="emoji" data-emoji="🧡">🧡</button>
                    <button class="emoji" data-emoji="💛">💛</button>
                    <button class="emoji" data-emoji="💚">💚</button>
                    <button class="emoji" data-emoji="💙">💙</button>
                    <button class="emoji" data-emoji="💜">💜</button>
                    <button class="emoji" data-emoji="💔">💔</button>
                    <button class="emoji" data-emoji="💕">💕</button>
                    <button class="emoji" data-emoji="⭐">⭐</button>
                    <button class="emoji" data-emoji="🌟">🌟</button>
                    <button class="emoji" data-emoji="✨">✨</button>
                    <button class="emoji" data-emoji="🔥">🔥</button>
                    <button class="emoji" data-emoji="💯">💯</button>
                    <button class="emoji" data-emoji="🎉">🎉</button>
                    <button class="emoji" data-emoji="🎁">🎁</button>
                    <button class="emoji" data-emoji="🌹">🌹</button>
                    <button class="emoji" data-emoji="🌈">🌈</button>
                    <button class="emoji" data-emoji="☕">☕</button>
                </div>
            </div>

            <div class="input-area">
                <button id="attach-button" title="Attach file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <button id="camera-button" title="Camera">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </button>
                <button id="emoji-button" title="Emojis">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </button>
                <button id="image-button" title="Generate image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                <input type="text" id="user-input" placeholder="Message AI..." autocomplete="off">
                <button id="voice-button" title="Voice input">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <button id="send-button" title="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>

                <input type="file" id="file-input" accept="image/*,application/pdf,.doc,.docx,.txt" style="display: none;">
                <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
            </div>

        </div>

    </div>

    <div id="lang-modal" class="lang-modal">
        <div class="lang-modal-content">
            <div class="lang-modal-header">
                <h2>Choose Language</h2>
                <button id="lang-modal-close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="lang-grid" id="lang-grid"></div>
        </div>
    </div>

    <div id="image-viewer" class="image-viewer">
        <button id="image-viewer-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <img id="image-viewer-img" src="" alt="Preview">
    </div>

    <div id="share-modal" class="share-modal">
        <div class="share-modal-content">
            <div class="share-modal-header">
                <h2>Share message</h2>
                <button id="share-modal-close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="share-preview" id="share-preview"></div>
            <div class="share-actions">
                <button class="share-action" data-action="whatsapp">
                    <span class="share-icon" style="background:#25D366;">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    </span>
                    <span>WhatsApp</span>
                </button>
                <button class="share-action" data-action="telegram">
                    <span class="share-icon" style="background:#0088cc;">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                    </span>
                    <span>Telegram</span>
                </button>
                <button class="share-action" data-action="twitter">
                    <span class="share-icon" style="background:#000;">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </span>
                    <span>X / Twitter</span>
                </button>
                <button class="share-action" data-action="facebook">
                    <span class="share-icon" style="background:#1877F2;">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </span>
                    <span>Facebook</span>
                </button>
                <button class="share-action" data-action="email">
                    <span class="share-icon" style="background:#EA4335;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </span>
                    <span>Email</span>
                </button>
                <button class="share-action" data-action="sms">
                    <span class="share-icon" style="background:#34C759;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </span>
                    <span>SMS</span>
                </button>
                <button class="share-action" data-action="copy">
                    <span class="share-icon" style="background:#666;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </span>
                    <span>Copy text</span>
                </button>
                <button class="share-action" data-action="native">
                    <span class="share-icon" style="background:#0a84ff;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </span>
                    <span>More</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
